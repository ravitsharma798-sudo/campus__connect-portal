<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details - CampusConnect</title>
  
  <!-- Google Fonts: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Core Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared Navbar Target -->
  <header id="site-header" class="site-header"></header>

  <main id="main-content" class="main-content">
    <div class="container" style="padding-top: 1.5rem; padding-bottom: 3.5rem;">
      <!-- Breadcrumb Navigation -->
      <nav aria-label="Breadcrumb" style="margin-bottom: 1rem;">
        <ol style="list-style: none; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted);">
          <li><a href="index.html" style="color: var(--primary);">Home</a></li>
          <li>›</li>
          <li><a href="events.html" style="color: var(--primary);">Events Directory</a></li>
          <li>›</li>
          <li style="color: var(--text-main); font-weight: 600;">Event Details</li>
        </ol>
      </nav>

      <!-- Event Details Root (Populated by initEventDetails in events.js) -->
      <div id="event-details-root">
        <div style="text-align: center; padding: 4rem 0; color: var(--text-muted);">
          Loading event information...
        </div>
      </div>
    </div>
  </main>

  <!-- Shared Footer Target -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Application Logic Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/events.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('events');
      renderFooter();
      initEventDetails();
    });
  </script>
</body>
</html>
